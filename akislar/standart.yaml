ad: Standart (BE)
aciklama: >
  Arayüzü olmayan işler (komut satırı, servis, hesaplama motoru). Kod yazılmadan önce derin
  planlama: kapsam ve kabul paketi, analiz (uç durum ve kalite dahil), teknik plan, teslim planı,
  test senaryoları ve test altyapısı. Sonra her iş kalemi sırayla: önce kabul testi yazılır ve
  kilitlenir, sonra kod; her biri kendi onay kurulundan geçer. Ardından birleştirme, teslim
  paketi, senin kabulün ve gelişim önerileri. Ajan soruları önce ekipte oylanır.
fikir_butcesi_usd: 12

asamalar:
  - id: brif
    kapi: true                # "planlama" katılımında aşamanın sonunda onay kapın açılır
    ad: Kapsam ve kabul paketi
    ajan: urun-sahibi
    is_kurali_sana: true      # iş kuralı soruları (doküman-kod farkı, hesap, kapsam) ekibe uğramadan sana gelir
    once_soru: true           # ajan belgeyi yazmadan önce açık sorularını ve varsayımlarını sana getirir
    gorev: >
      Fikri kapsam ve kabul paketine çevir: problem, hedef kullanıcı, kapsam içi ve dışı,
      ölçülebilir kabul kriterleri (K1, K2...). Arayüz: yok (bu akışta yalnızca backend).
    girdiler: [fikir]
    cikti: brif

  - id: analiz
    kapi: true                # "planlama" katılımında aşamanın sonunda onay kapın açılır
    ad: Analiz belgesi
    ajan: analist
    is_kurali_sana: true      # iş kuralı soruları (doküman-kod farkı, hesap, kapsam) ekibe uğramadan sana gelir
    once_soru: true           # ajan belgeyi yazmadan önce açık sorularını ve varsayımlarını sana getirir
    gorev: Kapsam paketini kurallara, uç durumlara ve hata davranışına aç.
    girdiler: [fikir, brif]
    cikti: analiz
    dogrulama:
      - ad: Kapsam onayı
        inceleyen: urun-sahibi
        odak: Analiz brifteki her kabul kriterini kapsıyor mu? Kapsam dışına taşan bir şey var mı?
      - ad: Uygulanabilirlik
        inceleyen: mimar
        odak: Kurallar teknik olarak uygulanabilir ve test edilebilir mi? Çelişkili kural var mı?
      - ad: Uç durum ve kalite
        inceleyen: test-analisti
        odak: Her kural test edilebilir mi? Uç durumlar, hata davranışı ve beklenen sonuçlar eksiksiz ve ölçülebilir mi?
      - ad: Mevzuat
        inceleyen: mevzuat
        atlanabilir: true        # mevzuat konusu yoksa "kapsam dışı" der; sonraki aşamalarda çağrılmaz
        odak: Kişisel veri, rıza, saklama ya da finansal bilgilendirme açısından eksik bir gereksinim var mı?
    en_fazla_tur: 3

  - id: teknik-plan
    kapi: true                # "planlama" katılımında aşamanın sonunda onay kapın açılır
    once_soru: true           # Mimar planı yazmadan önce en çok şeyi değiştiren mimari seçimleri sana getirir
    ad: Teknik plan
    ajan: mimar
    gorev: Analizi en sade doğru teknik plana çevir (arayüz yok; yalnızca backend/). Uygulama sırasını öner. Önemli kararları ADR olarak yaz.
    girdiler: [brif, analiz]
    cikti: teknik-plan
    dogrulama:
      - ad: ADR biçimi
        adr: { en_az: 1 }
      - ad: Analist onayı
        inceleyen: analist
        odak: Plan analizdeki tüm kuralları ve uç durumları karşılıyor mu? Analizde olmayan bir şey eklenmiş mi?
      - ad: Güvenlik onayı
        inceleyen: guvenlik
        odak: Tehdit modeli, girdi doğrulama, gizli bilgi ve kişisel verinin saklanma/loglanma kararları yeterli mi?
      - ad: Mevzuat
        inceleyen: mevzuat
        atlanabilir: true
        odak: Veri saklama, loglama ve üçüncü taraf servis kararları uyum açısından sorun yaratıyor mu?
    en_fazla_tur: 2

  - id: teslim-plani
    kapi: true                # "planlama" katılımında aşamanın sonunda onay kapın açılır
    ad: Teslim planı
    ajan: proje-yoneticisi
    gorev: >
      Analizi ve teknik planı 2-6 sıralı iş kalemine böl (P1, P2...). Bu akışta yazılımcı
      be-yazilimci. Belgenin sonuna kovan-plan bloğunu ekle.
    girdiler: [brif, analiz, teknik-plan]
    cikti: teslim-plani
    dogrulama:
      - ad: Plan biçimi
        plan: true               # kovan-plan bloğu sistemce denetlenir: id, yazılımcı, bağımlılık, döngü
      - ad: Kapsam onayı
        inceleyen: urun-sahibi
        odak: Her kabul kriteri bir kaleme düşüyor mu? Sıra değeri erken veriyor mu? Kapsam dışı kalem var mı?
      - ad: Teknik sıra
        inceleyen: mimar
        odak: Kalemler teknik plana bağlı mı, bağımlılıklar doğru mu, her kalem tek başına test edilebilir mi?
    en_fazla_tur: 2

  - id: test-senaryolari
    ad: Test senaryoları
    ajan: test-analisti
    gorev: Kabul kriterleri ve uç durumlar için BE test senaryolarını çıkar; her senaryoyu bir iş kalemine (P1, P2...) bağla.
    girdiler: [brif, analiz, teknik-plan, teslim-plani]
    cikti: test-senaryolari
    dogrulama:
      - ad: PO onayı
        inceleyen: urun-sahibi
        odak: Senaryolar her kabul kriterini ürün gözüyle sınıyor mu?
      - ad: Analist onayı
        inceleyen: analist
        odak: Her kural ve uç durum için senaryo var mı, beklenen sonuçlar analizle uyumlu mu, her senaryo doğru kaleme bağlı mı?
    en_fazla_tur: 2

  - id: test-altyapisi
    ad: Test altyapısı
    ajan: test-otomasyon
    calisma_dizini: kod
    gorev: >
      Test altyapısını kur: testler/package.json, ortak yapılandırma ve test-be.sh. test-be.sh
      testler/be/ altındaki bütün kalem klasörlerini koşsun; henüz test yoksa yeşil dönsün.
      Kalem testlerini bu aşamada yazma.
    girdiler: [teknik-plan, teslim-plani, test-senaryolari]
    cikti: test-altyapisi
    yazabilir: [testler, test-be.sh]
    kilitle: [test-be.sh, testler/package.json]
    dogrulama:
      - ad: Altyapı çalışıyor
        komut: bash test-be.sh
        sure_dk: 10            # ilk çalıştırmada npm paketleri iner
      - ad: Altyapı onayı
        inceleyen: test-analisti
        odak: Betik bütün kalem klasörlerini koşacak mı? Senaryolardaki her kalemin testi bu düzene sığıyor mu?
    en_fazla_tur: 2

  # Teslim planındaki her kalem için aşağıdaki adımlar sırayla tekrarlanır (P1 Kabul testi, P1 İş kalemi, P2 ...).
  # Yer tutucular: {kalem} P1, {kalem_kucuk} p1, {baslik}, {kapsam}, {kabul}, {bagimli}, {gelistirici}, {alan}, {taraf}
  - id: kalemler
    ad: İş kalemleri
    tur: kalemler
    plan: teslim-plani
    geri_donus: teslim-plani
    gelistiriciler:
      be-yazilimci: { alan: backend, taraf: be }
    adimlar:
      - id: kabul-testi
        ad: Kabul testi
        ajan: test-otomasyon
        calisma_dizini: kod
        gorev: >
          {kalem} ({baslik}) için kabul testlerini yaz: test senaryolarında {kalem} kalemine bağlı her
          TS-ID için testler/{taraf}/{kalem_kucuk}/ altına bir test. Uygulama henüz yok; testler doğru
          sebeple kırmızı olmalı.
        girdiler: [analiz, teknik-plan, teslim-plani, test-senaryolari, test-altyapisi]
        cikti: "{kalem_kucuk}-kabul-testi"
        yazabilir: ["testler/{taraf}/{kalem_kucuk}"]
        kilitle: ["testler/{taraf}/{kalem_kucuk}"]
        dogrulama:
          - ad: Senaryo incelemesi
            inceleyen: analist
            odak: "{kalem} testleri bu kalemin kurallarını ve uç durumlarını analizdeki gibi sınıyor mu?"
          - ad: Kapsama onayı
            inceleyen: test-analisti
            odak: "{kalem} kalemine bağlı her TS-ID'nin otomatik testi var mı, beklenen sonuçlar senaryolarla uyumlu mu?"
        en_fazla_tur: 2

      - id: is-kalemi
        ad: İş kalemi
        ajan: "{gelistirici}"
        calisma_dizini: kod
        gorev: >
          {kalem} kalemini yaz: {kapsam} Teknik plana uy. Bu kalemin ve önceki kalemlerin kilitli
          testlerinin hepsi yeşil olmalı.
        girdiler: [analiz, teknik-plan, teslim-plani, "{kalem_kucuk}-kabul-testi"]
        cikti: "{kalem_kucuk}-is-notu"
        yazabilir: ["{alan}"]
        dogrulama:
          - ad: Testler
            komut: "bash test-{taraf}.sh"
            sure_dk: 10
          - ad: Uygunluk
            inceleyen: analist
            odak: Kod {kalem} kalemine ait kuralları, hata davranışını ve kullanıcıya görünen metinleri analize uygun karşılıyor mu?
          - ad: Kod incelemesi
            inceleyen: mimar
            odak: Kod plana uygun, sade ve doğru mu? Hard-code, plan dışı karmaşıklık ya da sayısal hassasiyet sorunu var mı?
          - ad: Test incelemesi
            inceleyen: test-analisti
            odak: Kod testleri gerçekten mi geçiyor? Test girdilerine özel dal ya da testi anlamsızlaştıran bir hile var mı?
          - ad: Güvenlik incelemesi
            inceleyen: guvenlik
            odak: Kodda KRİTİK ya da YÜKSEK seviyede güvenlik açığı var mı?
        en_fazla_tur: 4

  - id: birlestirme
    ad: Birleştirme
    ajan: test-otomasyon
    calisma_dizini: kod
    gorev: >
      Kalemleri uçtan uca bağlayan senaryoları testler/be/entegrasyon/ altına yaz ve bütün testleri
      birlikte koş. Uygulama hatası bulursan düzeltme; "UYGULAMA HATASI:" diye ilgili kalemle yaz.
    girdiler: [analiz, teknik-plan, test-senaryolari, kalemler]
    cikti: birlestirme
    yazabilir: [testler/be/entegrasyon]
    kilitle: [testler/be/entegrasyon]
    dogrulama:
      - ad: Bütün testler
        komut: bash test-be.sh
        sure_dk: 10
      - ad: Birleştirme onayı
        inceleyen: mimar
        odak: Kalemler birlikte plandaki gibi çalışıyor mu? Kalemler arasında çelişen ya da tekrar eden kod var mı?
    en_fazla_tur: 2

  - id: teslim
    ad: Teslim paketi
    ajan: proje-yoneticisi
    gorev: >
      Teslim paketini yaz: kalem kalem ne teslim edildi, nasıl çalıştırılır, test sonuçları,
      alınan kararlar, bilinen sınırlar ve açık riskler.
    girdiler: [brif, teslim-plani, kalemler, birlestirme, kararlar]
    cikti: teslim
    dogrulama:
      - ad: PO onayı
        inceleyen: urun-sahibi
        odak: Teslim paketi kabul kriterlerini doğru yansıtıyor mu? Girdilerde olmayan bir başarı iddiası var mı?
    en_fazla_tur: 2

  - id: kabul
    ad: Kabul
    tur: insan
    soru: Kalemler, testler ve onay kurulları tamam. Teslim paketini incele; kabul et ya da notunla geri gönder.

  - id: gelisim
    ad: Gelişim önerileri
    tur: gelisim
    ajan: urun-sahibi
    gorev: >
      Teslim edilen ürünü kullanıcı gözüyle değerlendir ve onu daha iyiye götürecek 2-5 gelişim önerisi
      getir. Gelişim defterindeki kararlara uy. Belgenin sonuna kovan-gelisim bloğunu ekle.
    girdiler: [brif, teslim, gelisim-defteri]
    cikti: gelisim-onerileri
