# Kovan ayarları

port: 8765

# Yeni fikirde varsayılan mod:
#   hibrit  -> her ajan kartındaki motoru kullanır (kod: yerel Qwen, analiz ve onay: Claude)
#   claude  -> hepsi Claude (yerel motor hazır değilse ya da kıyas için)
#   yerel   -> hepsi yerel motorda (aşağıdaki qwen-yerel): kod ve belgeler bu makineden çıkmaz.
#              Kurum içi kodu replatform ederken. Daha yavaş, daha çok düzeltme turu.
#   deneme  -> token harcamaz, akışı gösterir
motor: hibrit

# claude komutu PATH'te değilse tam yolunu yaz. Terminal'de `which claude` sana yolu söyler.
claude_yolu: claude

# Ortamda ANTHROPIC_API_KEY ya da ANTHROPIC_BASE_URL gibi değişkenler varsa claude onları kullanıp
# API'den ücretlendirebilir ya da başka bir sunucuya (ör. Ollama) gidebilir.
# true: Claude ajanları için bunlar yok sayılır, Claude aboneliğinle giriş yaptığın hesap kullanılır.
# (Yerel motor kendi değişkenlerini yalnızca kendi ajanları için ayarlar.)
api_anahtarini_yoksay: true

# Yerel motorlar. Ajan kartında `motor: qwen-yerel` diyen ajanlar bunu kullanır; "Hepsi yerel" modunda
# bütün ajanlar (analiz, onay, oylama dahil) bunu kullanır ve hiçbir çağrı Claude'a gitmez.
# Kurulum: Ollama-Kur.command'a çift tıkla (Ollama'yı kurar, bağlamı 64k yapar, belleğine göre modeli
# indirir ve aşağıdaki model satırını günceller). Elle kurmak için README'deki "Qwen hibrit kurulumu".
# Model seçimi (birleşik bellek):
#   32 GB+ -> qwen3-coder:30b   (MoE, hızlı; varsayılan)
#   16-24 GB -> qwen3.5:9b      (küçük; basit kalemlerde iş görür)
#   16 GB altı -> yerel kodlama zayıf kalır; 'Hepsi Claude' modunu öneririm
#
# Kurum içi LLM (OpenAI uyumlu: vLLM, TGI, LM Studio, kurum ağ geçidi) için motoru burada değil, repo
# dışındaki bir dış ayar dosyasında tanımla: npm start -- --ayar ~/.kovan/kovan.yaml (örnek:
# ornekler/kurum-ayar.ornek.yaml). O motorda ajanlar Kovan'ın kendi döngüsüyle çalışır, Claude Code gerekmez.
motorlar:
  qwen-yerel:
    tur: ollama
    adres: http://127.0.0.1:11434
    model: qwen3-coder:30b

# Aynı anda kaç fikir çalışsın. Abonelik limitlerin için 1 önerilir.
paralel_fikir: 1

# Bir aşamanın onay kurulu (Mimar, PO, Güvenlik...) aynı anda mı çalışsın. false: sırayla.
paralel_inceleme: true

# Revizyon turunda, önceki turda ONAY veren onaycı yeniden bakmasın (token tasarrufu). Testler ve sistem
# denetimleri her turda koşar; aşamaya geri gönderilince ya da aşama yeniden doğrulanınca herkes yeniden bakar.
onayi_koru: true

# Geçici hatada (yoğunluk, ağ) bir adım kaç kez denensin. Kalıcı hatalar (oturum yok,
# limit doldu, Ollama kapalı) tekrar denenmez, doğrudan sana sorulur.
deneme_sayisi: 2

# Deneme motorunda her adımın yaklaşık süresi (saniye).
deneme_gecikme_sn: 1.0

# İnsan döngüde: ajanlar karar veremediklerinde sana seçenekli soru sorar (önerdikleri seçenek ilk sırada,
# her zaman kendi cevabını da yazabilirsin). Cevapların karar defterine yazılır ve sonraki bütün ajanlar görür.
ajan_sorulari: true

# Bir aşamada en fazla kaç soru turu açılsın (ekibin ya da senin karar verdiğin). Dolunca ajanlara
# "VARSAYIM yazıp devam et" denir.
en_fazla_soru_turu: 2

# Ortak karar: ajan soruları önce bu kurula gider. Kurul üyeleri bağımsız oy verir; soruyu soranın önerisi
# de bir oydur. Oybirliği çıkarsa karar ekibindir ve sana sorulmaz (karar defterine "ekip kararı" diye yazılır).
# Anlaşamazlarsa soru oylarla birlikte sana gelir. Para, hukuki risk ve geri dönüşsüz kararları ajanlar
# doğrudan sana sorar. Bir akışta kapatmak için akış dosyasına "ortak_karar: false" yaz (Mini'de kapalı).
#   kural: oybirligi (hepsi aynı seçenek) ya da cogunluk (yarıdan fazlası)
ortak_karar:
  acik: true
  kurul: [urun-sahibi, mimar, analist]
  kural: oybirligi
